name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      - name: Inject Git Commit
        run: |
          sed -i "s/val gitCommit = \"unknown\"/val gitCommit = \"${GITHUB_SHA::7}\"/" app/build.gradle.kts
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace


      - name: Rename APK
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | awk '{print $3}')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OBDLogger-v${VERSION_NAME}-build${VERSION_CODE}-debug.apk || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KylaqOBD2Scan-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # FIX: Self-report build outcome to the commit so the commits page shows
      # a green/red badge. Without this step the Actions run passes/fails but
      # the commit status API returns empty - making CI look unproven to humans
      # and to branch protection rules.
      # Using curl (guaranteed on ubuntu-latest) instead of gh CLI for maximum reliability.
      - name: Report commit status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Build passed"
          else
            STATE="failure"
            DESC="Build failed"
          fi
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"description\":\"$DESC\",\"context\":\"ci/build-apk\"}" \
            || echo "Status report failed (non-fatal)"
