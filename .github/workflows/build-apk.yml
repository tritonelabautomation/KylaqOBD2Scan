name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # FIX (CI never ran the tests): this workflow only executed `assembleDebug`, so a whole
  # batch of failing and self-contradictory unit tests shipped unnoticed. Unit tests now run
  # as their own job with their own commit status context (`ci/unit-tests`) so results are
  # visible on every push and pull request without blocking APK artifacts. Once the suite is
  # confirmed green, add `needs: unit-tests` to the `build` job to make it a hard gate.
  unit-tests:
    runs-on: ubuntu-latest

    permissions:
      statuses: write
      # Needed to post the test-failure digest back onto the pull request.
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # continue-on-error so the reporting steps below always run; the job is still
      # failed at the end by "Fail the job when tests failed".
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest -PciExcludeRobolectric=1 --stacktrace --continue 2>&1 | tee /tmp/unit-tests.log
          STATUS=$?
          if [ $STATUS -ne 0 ] && grep -q "ApplicationManager.getApplication() is null" /tmp/unit-tests.log; then
            echo "KSP2 worker-init NPE flake detected - retrying once with ksp.incremental=false..."
            gradle testDebugUnitTest -PciExcludeRobolectric=1 --stacktrace --continue -Pksp.incremental=false 2>&1 | tee /tmp/unit-tests.log
            STATUS=$?
          fi
          exit $STATUS

      # Actions logs and artifacts are served from domains that are not reachable from
      # every environment that has to triage a red run, so the digest is parsed here and
      # posted back to the pull request instead.
      - name: Build test failure digest
        if: always()
        run: python3 tools/ci/collect_test_failures.py --log /tmp/unit-tests.log > /tmp/test-report.md

      # Oracle guarantee: when gradle fails before/without parseable test results
      # (compile errors, infra failures), post the raw log tail so a red run is
      # ALWAYS diagnosable from the PR without touching the blocked log host.
      - name: Fallback digest from log tail
        if: always() && steps.unit-tests.outcome == 'failure'
        run: |
          if [ ! -s /tmp/test-report.md ]; then
            {
              echo "### CI failure tail (no parseable test report)"
              echo ""
              echo '```'
              tail -n 100 /tmp/unit-tests.log
              echo '```'
            } > /tmp/test-report.md
          fi

      - name: Comment digest on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/test-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-report.md
          fi

      - name: Fail the job when tests failed
        if: always() && steps.unit-tests.outcome == 'failure'
        run: |
          echo "Unit tests failed - see the pull-request comment and the unit-test-reports artifact."
          exit 1

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Report commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Unit tests passed"
          else
            STATE="failure"
            DESC="Unit tests failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f description="$DESC" \
            -f context="ci/unit-tests" || echo "Status report failed (non-fatal)"

  build:
    runs-on: ubuntu-latest

    # REQUIRED: Without this, GITHUB_TOKEN has zero permissions and the status
    # API call silently fails (GitHub returns 403). We only need statuses: write.
    permissions:
      statuses: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=$?
          if [ $STATUS -ne 0 ] && grep -q "ApplicationManager.getApplication() is null" /tmp/build.log; then
            echo "KSP2 worker-init NPE flake detected - retrying once with ksp.incremental=false..."
            gradle assembleDebug --stacktrace -Pksp.incremental=false 2>&1 | tee /tmp/build.log
            STATUS=$?
          fi
          exit $STATUS

      # Extract actual evaluated version metadata from the built APK using aapt.
      # This is the only reliable way to get the evaluated versionName and versionCode
      # since Gradle templates in build.gradle.kts are not evaluated until build time.
      - name: Extract APK metadata
        id: apk-meta
        run: |
          # Install aapt (part of Android SDK build-tools)
          sudo apt-get update -qq && sudo apt-get install -y -qq android-sdk-build-tools > /dev/null 2>&1 || true

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "version_name=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep "versionName" | sed 's/.*versionName='"'"'\([^'"'"']*\)'"'"'.*/\1/')" >> $GITHUB_OUTPUT
            echo "version_code=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep "versionCode" | sed 's/.*versionCode='"'"'\([^'"'"']*\)'"'"'.*/\1/')" >> $GITHUB_OUTPUT
            echo "pkg_name=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep "package: name=" | sed 's/.*name='"'"'\([^'"'"']*\)'"'"'.*/\1/')" >> $GITHUB_OUTPUT
            echo "sha_short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "run_number=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          else
            echo "version_name=unknown" >> $GITHUB_OUTPUT
            echo "version_code=0" >> $GITHUB_OUTPUT
            echo "pkg_name=unknown" >> $GITHUB_OUTPUT
            echo "sha_short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "run_number=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          fi

      # Rename APK to a deterministic, traceable name.
      # Format: KylaqOBD2Scan-{versionName}-r{runNumber}-{git-sha}-debug.apk
      - name: Rename APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            VN="${{ steps.apk-meta.outputs.version_name }}"
            VC="${{ steps.apk-meta.outputs.version_code }}"
            RN="${{ steps.apk-meta.outputs.run_number }}"
            SHA="${{ steps.apk-meta.outputs.sha_short }}"
            NEW_NAME="KylaqOBD2Scan-${VN}-r${RN}-${SHA}-debug.apk"
            mv "$APK_PATH" "app/build/outputs/apk/debug/$NEW_NAME"
            echo "Renamed to: $NEW_NAME"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KylaqOBD2Scan-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build summary
        run: |
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ steps.apk-meta.outputs.pkg_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.apk-meta.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Code | ${{ steps.apk-meta.outputs.version_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Run | #${{ steps.apk-meta.outputs.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.apk-meta.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY

      # Self-report build outcome to the commit so the commits page shows
      # a green/red badge. Without this step the Actions run passes/fails but
      # the commit status API returns empty - making CI look unproven to humans
      # and to branch protection rules.
      # NOTE: gh cli is pre-installed on ubuntu-latest. Requires 'permissions: statuses: write'.
      - name: Report commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Build passed"
          else
            STATE="failure"
            DESC="Build failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f description="$DESC" \
            -f context="ci/build-apk" || echo "Status report failed (non-fatal)"
